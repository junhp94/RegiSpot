name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /RegiSpot/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      # GitHub Pages serves any path under /RegiSpot/ as a SPA.
      # Browsers that refresh a deep link (e.g. /RegiSpot/groups/abc) get a 404
      # from Pages, which then serves 404.html — copying index.html there makes
      # React Router handle the route instead of showing a blank error page.
      - name: Copy index.html to 404.html for SPA deep-link support
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
